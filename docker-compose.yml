services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: crdf-backend
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONPATH=/app
      - PYTHONIOENCODING=utf-8
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SERPER_API_KEY=${SERPER_API_KEY}
      - MODEL=${MODEL}
      - CREWAI_TRACING_ENABLED=${CREWAI_TRACING_ENABLED}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - CRDF_API_KEY=${CRDF_API_KEY}
      - CRDF_MAX_CONCURRENT=${CRDF_MAX_CONCURRENT:-2}
      - CRDF_MAX_RPM=${CRDF_MAX_RPM}
    ports:
      - '8000:8000'
    networks:
      - crdf-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - crdf-uploads:/tmp/crdf_uploads

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: crdf-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '80:80'
    networks:
      - crdf-net
    restart: unless-stopped

networks:
  crdf-net:
    driver: bridge

volumes:
  crdf-uploads:
