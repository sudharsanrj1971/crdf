name: CRDF CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Install Node deps
        run: npm ci
      - name: TypeScript lint
        run: npx tsc --noEmit
      - name: Frontend build
        run: npx vite build
      - name: Python tests
        run: pytest test_edge_cases.py -v --tb=short
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        continue-on-error: true  # Tests require real API keys

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f Dockerfile.backend -t crdf-backend:${{ github.sha }} .
      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t crdf-frontend:${{ github.sha }} .
      - name: Verify backend image health
        run: |
          docker run -d --name test-backend \
            -e GEMINI_API_KEY=test \
            -e SERPER_API_KEY=test \
            -p 8000:8000 \
            crdf-backend:${{ github.sha }}
          sleep 10
          docker logs test-backend
          docker stop test-backend
